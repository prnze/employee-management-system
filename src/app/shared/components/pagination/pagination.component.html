    <nav [attr.aria-label]="'PAGINATION_TABLE' | translate" class="d-flex align-items-center justify-content-between gap-3 flex-wrap">
      <small class="text-body-secondary">{{ 'PAGINATION_PAGE' | translate }} {{ page() }} {{ 'PAGINATION_OF' | translate }} {{ totalPages() }}</small>
      <ul class="pagination mb-0">
        <li class="page-item" [class.disabled]="page() === 1">
          <button class="page-link" type="button" [attr.aria-label]="'PAGINATION_PREVIOUS_PAGE' | translate" (click)="goTo(page() - 1)">{{ 'PAGINATION_PREVIOUS' | translate }}</button>
        </li>
        @for (item of pages(); track item) {
          <li class="page-item" [class.active]="item === page()">
            <button class="page-link" type="button" [attr.aria-label]="('PAGINATION_GO_TO_PAGE' | translate) + ' ' + item" (click)="goTo(item)">{{ item }}</button>
          </li>
        }
        <li class="page-item" [class.disabled]="page() === totalPages()">
          <button class="page-link" type="button" [attr.aria-label]="'PAGINATION_NEXT_PAGE' | translate" (click)="goTo(page() + 1)">{{ 'PAGINATION_NEXT' | translate }}</button>
        </li>
      </ul>
    </nav>
