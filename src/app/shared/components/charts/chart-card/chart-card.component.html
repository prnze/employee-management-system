    <div class="surface p-3 h-100 d-flex flex-column">
      <!-- Header -->
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h6 fw-semibold mb-0">{{ title() }}</h2>
        @if (badge()) {
          <span class="badge" [class]="badgeClass()">{{ badge() }}</span>
        }
      </div>

      <!-- Loading state -->
      @if (loading()) {
        <div class="flex-grow-1 placeholder-glow d-flex flex-column gap-2 justify-content-center" aria-busy="true" [attr.aria-label]="('COMMON_LOADING' | translate) + ' ' + title()">
          <span class="placeholder col-12 rounded" [style.height]="skeletonHeight()"></span>
        </div>

      <!-- Error state -->
      } @else if (error()) {
        <div class="flex-grow-1 d-flex flex-column align-items-center justify-content-center text-danger gap-2">
          <span class="fs-2" aria-hidden="true"><app-icon [icon]="APP_ICONS.WARNING" [size]="24"></app-icon></span>
          <p class="mb-0 small fw-semibold">{{ 'CHART_FAILED_TO_LOAD' | translate }}</p>
          <p class="mb-0 small text-body-secondary">{{ error() }}</p>
        </div>

      <!-- Content slot -->
      } @else {
        <div class="flex-grow-1">
          <ng-content />
        </div>

        <!-- Optional footer slot -->
        <ng-content select="[slot=footer]" />
      }
    </div>
