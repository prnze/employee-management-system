<header class="text-center text-md-start mb-4">
  <h1 class="display-6 fw-bold mb-2 text-gradient">{{ 'AUTH_SIGN_IN' | translate }}</h1>
  <p class="text-muted small mb-0">{{ 'AUTH_DEMO_HINT' | translate }}</p>
</header>

@if (error()) { 
  <div class="alert alert-danger border-0 small mb-4" role="alert" style="border-radius: 12px;">
    {{ error() }}
  </div> 
}

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>
  <div class="form-fields-wrapper mb-3">
    <app-form-field
      #emailField
      label="AUTH_EMAIL"
      [required]="true"
      [control]="form.controls.email">
      <app-input
        [id]="emailField.id"
        type="email"
        formControlName="email"
        autocomplete="email">
      </app-input>
    </app-form-field>

    <app-form-field
      #passwordField
      label="AUTH_PASSWORD"
      [required]="true"
      [control]="form.controls.password">
      <app-input
        [id]="passwordField.id"
        type="password"
        formControlName="password"
        autocomplete="current-password">
      </app-input>
    </app-form-field>
  </div>

  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <app-checkbox
      [label]="'AUTH_REMEMBER_ME' | translate"
      formControlName="rememberMe">
    </app-checkbox>
    <a routerLink="/ems/auth/forgot-password" class="text-link small">{{ 'AUTH_FORGOT_PASSWORD' | translate }}</a>
  </div>

  <button class="btn btn-primary w-100 py-2" type="submit" [disabled]="form.invalid || loading()">
    @if (loading()) {
      <app-loader [label]="'AUTH_SIGNING_IN' | translate" />
    } @else {
      {{ 'AUTH_SIGN_IN_BTN' | translate }}
    }
  </button>
</form>
