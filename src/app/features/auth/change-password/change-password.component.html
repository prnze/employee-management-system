<app-modal [open]="open()" [title]="'CHANGE_PWD_TITLE' | translate" [closeable]="false">
  <form [formGroup]="form" (ngSubmit)="submit()" class="row g-3 mt-1">
    <div class="col-12">
      <app-form-field
        #currentPasswordField
        label="CHANGE_PWD_CURRENT"
        [required]="true"
        [control]="form.controls.currentPassword">
        <app-input
          [id]="currentPasswordField.id"
          type="password"
          formControlName="currentPassword"
          [placeholder]="'CHANGE_PWD_CURRENT' | translate">
        </app-input>
      </app-form-field>
    </div>
    <div class="col-12">
      <app-form-field
        #newPasswordField
        label="CHANGE_PWD_NEW"
        [required]="true"
        [control]="form.controls.newPassword">
        <app-input
          [id]="newPasswordField.id"
          type="password"
          formControlName="newPassword"
          [placeholder]="'CHANGE_PWD_NEW' | translate">
        </app-input>
      </app-form-field>
    </div>
    <div class="col-12">
      <app-form-field
        #confirmPasswordField
        label="CHANGE_PWD_CONFIRM"
        [required]="true"
        [control]="form.controls.confirmPassword">
        <app-input
          [id]="confirmPasswordField.id"
          type="password"
          formControlName="confirmPassword"
          [placeholder]="'CHANGE_PWD_CONFIRM' | translate">
        </app-input>
      </app-form-field>
    </div>
    <div class="col-12 d-flex justify-content-end gap-2 mt-4 pt-2 border-top">
      <button class="btn btn-outline-secondary btn-sm px-3" type="button" (click)="closed.emit()">
        {{ 'COMMON_CANCEL' | translate }}
      </button>
      <button class="btn btn-primary btn-sm px-3" type="submit" [disabled]="form.invalid">
        {{ 'CHANGE_PWD_SAVE' | translate }}
      </button>
    </div>
  </form>
</app-modal>
