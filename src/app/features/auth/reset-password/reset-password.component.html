<h1 class="h3">{{ 'RESET_PWD_TITLE' | translate }}</h1>
@if (done()) {
  <div class="alert alert-success">{{ 'RESET_PWD_SUCCESS' | translate }}</div>
}
<form [formGroup]="form" (ngSubmit)="submit()">
  <app-form-field
    #passwordField
    label="RESET_PWD_NEW"
    [required]="true"
    [control]="form.controls.password">
    <app-input
      [id]="passwordField.id"
      type="password"
      formControlName="password"
      [placeholder]="'RESET_PWD_NEW' | translate">
    </app-input>
  </app-form-field>

  <app-form-field
    #confirmPasswordField
    label="RESET_PWD_CONFIRM"
    [required]="true"
    [control]="form.controls.confirmPassword">
    <app-input
      [id]="confirmPasswordField.id"
      type="password"
      formControlName="confirmPassword"
      [placeholder]="'RESET_PWD_CONFIRM' | translate">
    </app-input>
  </app-form-field>

  <button class="btn btn-primary w-100" type="submit" [disabled]="form.invalid">
    {{ 'RESET_PWD_SUBMIT' | translate }}
  </button>
  <a class="btn btn-link w-100 mt-2" routerLink="/auth/login">{{ 'RESET_PWD_BACK' | translate }}</a>
</form>
