<nav class="sx-nav" aria-label="ShareX navigation">
  <a class="sx-nav-brand" routerLink="/sharex" aria-label="ShareX home">
    <span class="sx-nav-brand-icon" aria-hidden="true">
      <span class="material-symbols-rounded">ios_share</span>
    </span>
    <span class="sx-nav-brand-text">ShareX</span>
  </a>

  <div class="sx-nav-links">
    <a routerLink="/sharex/create" routerLinkActive="sx-nav-link--active" class="sx-nav-link">
      <span class="material-symbols-rounded" aria-hidden="true">add_circle</span>
      <span>Create</span>
    </a>
    <a routerLink="/sharex/dashboard" routerLinkActive="sx-nav-link--active" class="sx-nav-link">
      <span class="material-symbols-rounded" aria-hidden="true">space_dashboard</span>
      <span>Dashboard</span>
    </a>
    <a routerLink="/sharex/about" routerLinkActive="sx-nav-link--active" class="sx-nav-link">
      <span class="material-symbols-rounded" aria-hidden="true">info</span>
      <span>About</span>
    </a>
  </div>

  <div class="sx-nav-controls" aria-label="Appearance controls">
    <div class="sx-theme-switch" role="group" aria-label="Theme">
      <button type="button" [class.is-selected]="themeService.theme() === 'dark'" (click)="setTheme('dark')" aria-label="Use dark theme">
        <span class="material-symbols-rounded" aria-hidden="true">dark_mode</span>
      </button>
      <button type="button" [class.is-selected]="themeService.theme() === 'light'" (click)="setTheme('light')" aria-label="Use light theme">
        <span class="material-symbols-rounded" aria-hidden="true">light_mode</span>
      </button>
    </div>

    <div class="sx-accent-menu">
      <button type="button" class="sx-accent-current" aria-label="Accent color">
        <span [style.background]="themeService.accent().value"></span>
      </button>
      <div class="sx-accent-popover" role="menu" aria-label="Accent colors">
        @for (accent of themeService.accents; track accent.name) {
          <button
            type="button"
            role="menuitemradio"
            [attr.aria-checked]="themeService.accentName() === accent.name"
            [class.is-selected]="themeService.accentName() === accent.name"
            (click)="setAccent(accent)"
            [title]="accent.name">
            <span [style.background]="accent.value"></span>
          </button>
        }
      </div>
    </div>
  </div>
</nav>

@if (isDragOverGlobal()) {
  <div class="sx-global-dropzone" aria-label="Drop files to upload">
    <div class="sx-global-dropzone-inner sx-glass">
      <div class="sx-global-dropzone-icon">
        <span class="material-symbols-rounded" aria-hidden="true">cloud_upload</span>
      </div>
      <p class="sx-global-dropzone-title">Drop files anywhere</p>
      <p class="sx-global-dropzone-subtitle">Files will be added to a new share.</p>
    </div>
  </div>
}

<main class="sx-main" id="sharex-main-content" [class.sx-main--blurred]="isDragOverGlobal()">
  <router-outlet />
</main>

<footer class="sx-footer">
  <div class="sx-footer-inner">
    <span class="sx-footer-brand">ShareX</span>
    <span class="sx-footer-separator">/</span>
    <span class="sx-footer-text">Temporary sharing, made calm.</span>
  </div>
</footer>
