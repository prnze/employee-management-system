<div class="app-shell d-flex flex-column" [class.sidebar-collapsed]="shell.sidebarCollapsed()">
  <!-- Top Navigation (fixed, always visible, full-width) -->
  <app-top-navbar class="flex-shrink-0" />

  <!-- Underneath the Top Navigation: Sidebar & Main Content -->
  <div class="app-shell-body d-flex flex-grow-1 overflow-hidden">
    <!-- Desktop Sidebar (fixed width, fixed height, no horizontal scroll) -->
    <div class="desktop-sidebar d-none d-md-block flex-shrink-0">
      <app-sidebar [items]="items" />
    </div>

    <!-- Mobile Sidebar Drawer (Offcanvas) -->
    <div class="offcanvas offcanvas-start" [class.show]="shell.mobileSidebarOpen()" [style.visibility]="shell.mobileSidebarOpen() ? 'visible' : 'hidden'" tabindex="-1" id="mobileSidebar" aria-labelledby="mobileSidebarLabel">
      <div class="offcanvas-header">
        <h2 class="offcanvas-title fs-5" id="mobileSidebarLabel">{{ 'NAV_NAVIGATION' | translate }}</h2>
        <button class="btn-close" type="button" (click)="shell.closeMobileSidebar()" [attr.aria-label]="'COMMON_CLOSE' | translate"></button>
      </div>
      <div class="offcanvas-body p-0">
        <app-sidebar [items]="items" />
      </div>
    </div>
    @if (shell.mobileSidebarOpen()) {
      <div class="offcanvas-backdrop fade show" (click)="shell.closeMobileSidebar()"></div>
    }

    <!-- Right Side: Scrollable Content Area -->
    <div class="content-area flex-grow-1 d-flex flex-column overflow-y-auto">
      <app-breadcrumb class="flex-shrink-0" />
      <main id="main-content" class="app-page flex-grow-1">
        <router-outlet />
      </main>
      <app-footer class="flex-shrink-0" />
    </div>
  </div>
</div>
